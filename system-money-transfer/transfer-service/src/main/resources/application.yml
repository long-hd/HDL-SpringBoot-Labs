server:
  port: 8082

spring:
  application:
    name: transfer-service

  # BƯỚC 6: lấy config nghiệp vụ từ Config Server. 'optional:' để service vẫn khởi động được
  # nếu Config Server chưa chạy (không chết cứng). Đây là cơ chế Spring Boot 2.4+, thay cho
  # bootstrap.yml cũ. Địa chỉ Config Server nằm ở ĐÂY (bootstrap config) — không thể đưa vào
  # chính Config Server (vòng luẩn quẩn).
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    # DB riêng của transfer-service.
    url: jdbc:postgresql://localhost:5432/transfer_db
    username: postgres
    password: 123456789

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Cho phép gọi POST /actuator/refresh để nạp lại config từ Config Server lúc chạy.
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

# BƯỚC 3: không còn URL cứng. transfer-service gọi account-service theo TÊN qua Eureka.
account-service:
  # Chọn cơ chế client (giữ nguyên từ bước 2):
  #   http-interface = Spring HTTP Interface (@HttpExchange) — MẶC ĐỊNH
  #   feign          = OpenFeign
  # Cả hai giờ đều gọi theo tên "account-service" và load-balance; TransferService không đổi.
  client: http-interface

# Đăng ký transfer-service vào Eureka + để tra cứu account-service.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
