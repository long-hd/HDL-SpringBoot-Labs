server:
  port: 8082

spring:
  application:
    name: transfer-service

  # BƯỚC 6: lấy config nghiệp vụ từ Config Server. 'optional:' để service vẫn khởi động được
  # nếu Config Server chưa chạy (không chết cứng). Đây là cơ chế Spring Boot 2.4+, thay cho
  # bootstrap.yml cũ. Địa chỉ Config Server nằm ở ĐÂY (bootstrap config) — không thể đưa vào
  # chính Config Server (vòng luẩn quẩn).
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    # DB riêng của transfer-service.
    url: jdbc:postgresql://localhost:5432/transfer_db
    username: postgres
    password: 123456789

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # RECONCILE: chạy schema.sql lúc khởi động để tạo bảng shedlock (không phải JPA entity nên
  # ddl-auto không tạo giúp). CREATE TABLE IF NOT EXISTS nên chạy lại vô hại.
  sql:
    init:
      mode: always

# Cho phép gọi POST /actuator/refresh để nạp lại config từ Config Server lúc chạy.
# BƯỚC 7: thêm circuitbreakers/retries để xem trạng thái resilience.
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers,circuitbreakerevents,retries
  health:
    circuitbreakers:
      enabled: true

# BƯỚC 7: cấu hình resilience cho lời gọi tới account-service (tên instance "account").
resilience4j:
  circuitbreaker:
    instances:
      account:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                       # xét trên 10 lời gọi gần nhất
        minimum-number-of-calls: 5                    # cần tối thiểu 5 lời gọi mới đánh giá
        failure-rate-threshold: 50                    # >50% lỗi -> MỞ circuit
        wait-duration-in-open-state: 10s              # mở 10s rồi thử lại (half-open)
        permitted-number-of-calls-in-half-open-state: 3
        # Lỗi NGHIỆP VỤ không tính vào tỉ lệ lỗi (không được làm mở circuit).
        ignore-exceptions:
          - com.hdl.mt.transfer.client.AccountBusinessException
  retry:
    instances:
      account:
        max-attempts: 3                               # thử tối đa 3 lần
        wait-duration: 500ms                          # chờ giữa các lần
        # CHỈ retry lỗi hạ tầng; lỗi nghiệp vụ (thiếu tiền...) không retry.
        retry-exceptions:
          - com.hdl.mt.transfer.client.AccountUnavailableException
        ignore-exceptions:
          - com.hdl.mt.transfer.client.AccountBusinessException

  # BƯỚC 3: không còn URL cứng. transfer-service gọi account-service theo TÊN qua Eureka.
account-service:
  # Chọn cơ chế client (giữ nguyên từ bước 2):
  #   http-interface = Spring HTTP Interface (@HttpExchange) — MẶC ĐỊNH
  #   feign          = OpenFeign
  # Cả hai giờ đều gọi theo tên "account-service" và load-balance; TransferService không đổi.
  client: http-interface

# BƯỚC 7: timeout cho OpenFeign (đối xứng với timeout của RestClient trong AccountClientConfig).
# Quá hạn -> Feign ném lỗi -> adapter dịch thành AccountUnavailableException -> retry/circuit breaker.
spring.cloud.openfeign.client.config.default.connect-timeout: 2000
spring.cloud.openfeign.client.config.default.read-timeout: 2000

# Đăng ký transfer-service vào Eureka + để tra cứu account-service.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
