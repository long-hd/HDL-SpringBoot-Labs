server:
  port: 8888   # cổng chuẩn của Config Server

spring:
  application:
    name: config-server
  profiles:
    # Bật backend "native" = đọc config từ filesystem local (không dùng Git). Chuyển sang git
    # sau này chỉ là đổi cấu hình backend, không đụng code.
    active: native
  cloud:
    config:
      server:
        native:
          # Đường TUYỆT ĐỐI tới thư mục chứa file config, để không phụ thuộc "chạy lệnh từ
          # thư mục nào" (working directory của spring-boot:run là thư mục gốc repo, không phải
          # thư mục module — nên đường tương đối ./config-repo bị trật một tầng).
          #
          # ⚠️ ĐỔI path này nếu bạn clone repo ra chỗ khác / đổi máy. Có thể override khi chạy:
          #   mvn -pl config-server spring-boot:run \
          #       -Dspring-boot.run.jvmArguments="-Dspring.cloud.config.server.native.search-locations=file:/duong/dan/config-repo"
          search-locations:
            - file:/home/long/Workspace/spring/HDL-SpringBoot-Labs/system-money-transfer/config-server/config-repo
