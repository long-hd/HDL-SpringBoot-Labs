# Profile prod: locator (không gõ từng Path/uri) + limiter MỘT LẦN (default-filters).
# Chạy: --spring.profiles.active=prod
# Cần: Nacos, Redis, demo-provider đã đăng ký Nacos. Pom phải có nacos-discovery + loadbalancer.
#
# Lab (không prod): GET :8088/api/echo  — route yaml + StripPrefix.
# Profile này: GET :8088/demo-provider/echo?name=long
#   locator tạo /{serviceId}/** → lb://serviceId (docs RewritePath bỏ prefix tên service).
#
# Docs:
#   locator: https://docs.spring.io/spring-cloud-gateway/reference/4.3/spring-cloud-gateway-server-webflux/the-discoveryclient-route-definition-locator.html
#   default-filters: https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/gatewayfilter-factories/default-filters.html
#   RequestRateLimiter: https://docs.spring.io/spring-cloud-gateway/reference/4.3/spring-cloud-gateway-server-webflux/gatewayfilter-factories/requestratelimiter-factory.html
#
# Locator mặc định TẮT. Bật = mọi service Nacos (trừ biểu thức dưới) thành route public — thường quá rộng.
# Siết: metadata edge=true (comment). Không phải checklist TLS/auth/secret.

server:
  port: ${SERVER_PORT:8088}

spring:
  data:
    redis:
      # Boot 3: spring.data.redis. Prod set REDIS_PASSWORD, đừng commit secret.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        # Không set discovery.ip — K8s/VM tự đăng ký IP instance.
    gateway:
      server:
        webflux:
          # Thay list application.yml (còn /api/** + RequestRateLimiter trên route).
          # [] = không gõ tay backend; locator tạo route. Để sót list lab → limiter có thể chạy hai lần.
          routes: []

          discovery:
            locator:
              enabled: true
              # Bỏ chính Gateway, tránh /gateway-rate-limit/** tự proxy mình.
              include-expression: "serviceId != 'gateway-rate-limit'"
              # include-expression: "metadata['edge']=='true'"
              url-expression: "'lb://' + serviceId"

          # Mọi route locator đều qua filter này. Không copy replenishRate từng service.
          # Bean ipKeyResolver (RateLimiterConfig). Đổi user/API key thì sửa Java.
          default-filters:
            - name: RequestRateLimiter
              args:
                # Số là VÍ DỤ, không phải SLA. Lab yaml 1/2 mới dễ curl 429 trong một giây.
                redis-rate-limiter.replenishRate: ${GATEWAY_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

          # ipKeyResolver = IP TCP. Sau Nginx không set trusted-proxies → cả công ty một bucket (IP = Nginx).
          # Cloud 2025: X-Forwarded mặc định tắt.
          # trusted-proxies: ${GATEWAY_TRUSTED_PROXIES}

          # Hạn KHÁC một service: thêm MỘT route yaml (id/Path/lb://) với RequestRateLimiter args riêng.
          # Không phải gõ lại một trăm service. Locator vẫn lo các tên còn lại.

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.alibaba.nacos: WARN