spring:
  # Cấu hình Kafka, tương ứng với lớp cấu hình KafkaProperties
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # Chỉ định địa chỉ Kafka Broker, có thể thiết lập nhiều địa chỉ, phân cách bằng dấu phẩy

    # Cấu hình Kafka Producer
    producer:
      acks: 1 # 0 - không phản hồi. 1 - leader phản hồi. all - tất cả leader và follower phản hồi.
      retries: 3 # Số lần thử gửi lại khi gửi thất bại
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # Kiểu serialize của key trong message
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # Kiểu serialize của value trong message

    # Cấu hình Kafka Consumer
    consumer:
      auto-offset-reset: earliest # Thiết lập vị trí tiêu thụ ban đầu của consumer group là earliest.
      # Có thể tham khảo bài viết https://blog.csdn.net/lishuangzhe7047/article/details/74530417 để hiểu thêm
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false # Sử dụng cơ chế commit tiến độ tiêu thụ của Spring-Kafka
      properties:
        spring:
          json:
            trusted:
              packages: com.hdl.springboot.labs.lab03.kafkademo.message

    # Cấu hình Kafka Consumer Listener
    listener:
      missing-topics-fatal: false # Khi topic mà listener đăng ký không tồn tại, mặc định sẽ báo lỗi.
      # Đặt thành false để tránh lỗi này
      ack-mode: MANUAL

logging:
  level:
    org:
      springframework:
        kafka: ERROR # Log INFO của spring-kafka quá nhiều, nên chỉ in log ở mức ERROR
      apache:
        kafka: ERROR # Log INFO của kafka quá nhiều, nên chỉ in log ở mức ERROR