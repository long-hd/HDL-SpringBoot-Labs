# =============================================================================
# Profile: prod — cấu hình Kafka hướng production (best practice tham khảo)
# Module: lab-03-kafka-demo-concurrency
# Kích hoạt: --spring.profiles.active=prod
#             hoặc SPRING_PROFILES_ACTIVE=prod
#
# Lưu ý module concurrency:
# - Song song hữu ích ≤ số partition của topic (trong cùng consumer group).
# - Lab set concurrency="2" trên @KafkaListener; yaml listener.concurrency dưới đây
#   là default container — annotation trên listener vẫn override theo Spring Kafka.
# - Prod: tạo topic trước (IaC) với đủ partition; logic listener phải thread-safe.
# =============================================================================

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

    # ----- Client an toàn (bật khi cluster yêu cầu SASL/SSL; để comment nếu lab plaintext) -----
    # security:
    #   protocol: SASL_SSL
    # properties:
    #   sasl.mechanism: PLAIN
    #   sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}

    producer:
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: lz4
      batch-size: 65536
      buffer-memory: 67108864
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 60000

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:lab03-kafka-demo-concurrency}
      enable-auto-commit: false
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 100
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        spring:
          json:
            trusted:
              packages: com.hdl.springboot.labs.lab03.kafkademo.message
            use:
              type:
                headers: true

    listener:
      missing-topics-fatal: true
      # Tăng theo số partition; không nên > partitions được gán cho group trên topic đó.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:2}
      ack-mode: BATCH
      type: single

logging:
  level:
    root: INFO
    com.hdl.springboot.labs.lab03.kafkademo: INFO
    org:
      springframework:
        kafka: INFO
      apache:
        kafka: WARN
        kafka.clients.consumer: WARN
        kafka.clients.producer: WARN
