spring:
  # Các mục cấu hình Kafka, tương ứng với lớp cấu hình KafkaProperties
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # Chỉ định địa chỉ Kafka Broker, có thể thiết lập nhiều địa chỉ, phân cách bằng dấu phẩy
    # Các mục cấu hình Kafka Producer
    producer:
      acks: 1 # 0 - không phản hồi. 1 - Leader phản hồi. all - tất cả Leader và Follower phản hồi.
      retries: 3 # Số lần thử gửi lại khi gửi thất bại
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # Cấu hình tuần tự hóa (serialize) key của message
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # Cấu hình tuần tự hóa (serialize) value của message
    # Các mục cấu hình Kafka Consumer
    consumer:
      auto-offset-reset: earliest # Đặt vị trí tiêu thụ ban đầu của Consumer Group là earliest. Có thể tham khảo bài viết https://blog.csdn.net/lishuangzhe7047/article/details/74530417 để hiểu thêm
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer # Cấu hình giải tuần tự hóa (deserialize) key
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer # Cấu hình giải tuần tự hóa (deserialize) value
      properties:
        spring:
          json:
            trusted:
              packages: com.hdl.springboot.labs.lab03.kafkademo.message # Các package được tin cậy khi deserialize JSON
    # Cấu hình Kafka Consumer Listener
    listener:
      missing-topics-fatal: false # Khi topic mà listener đang lắng nghe không tồn tại, mặc định sẽ báo lỗi. Đặt false để tránh lỗi này

logging:
  level:
    org:
      springframework:
        kafka: ERROR # Log INFO của spring-kafka quá nhiều, nên chỉ hiển thị log ở mức ERROR
      apache:
        kafka: ERROR # Log INFO của Kafka quá nhiều, nên chỉ hiển thị log ở mức ERROR
